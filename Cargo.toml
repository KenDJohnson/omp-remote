[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crane]
name = "omp-remote"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
android-native-keyring-store = "1"
apple-native-keyring-store = { version = "1", features = [
  "keychain",
  "protected",
] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
ciborium = "0.2"
directories = "6"
dioxus = { version = "=0.7.9", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
futures-channel = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
js-sys = "0.3"
keyring-core = "1"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
rcgen = "0.14"
rusqlite = { version = "0.38", features = ["bundled"] }
rqrr = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
serde_repr = "0.1"
url = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "signal",
  "rt-multi-thread",
  "sync",
  "time",
] }
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = [
  "crypto-rust",
] }
uuid = { version = "1", features = ["rng-getrandom", "v4"] }
wasm-bindgen-test = "=0.3.71"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
