[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crane]
name = "omp-remote"

[workspace.dependencies]
base64 = "0.22"
ciborium = "0.2"
getrandom = "0.3"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
serde_repr = "0.1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4"] }
wasm-bindgen-test = "=0.3.71"
