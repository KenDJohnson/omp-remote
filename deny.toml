[bans]
multiple-versions = 'allow'

[licenses]
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cssparser"

[[licenses.exceptions]]
