[package]
name = "omp-control-client"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
getrandom.workspace = true
omp-control-protocol = { path = "../omp-control-protocol" }
omp-rpc = { path = "../omp-rpc" }
parking_lot.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keyring-core.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies]
zbus-secret-service-keyring-store.workspace = true


[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "BinaryType",
  "CloseEvent",
  "ErrorEvent",
  "Event",
  "MessageEvent",
  "Storage",
  "WebSocket",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rcgen.workspace = true
tokio-rustls = "0.26"

[dev-dependencies]
wasm-bindgen-test.workspace = true
